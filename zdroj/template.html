<title>Tisícka slovíčok</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow study column; index-card prompts, segmented status chips, tabs on top. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --line: #dde2ec;
  --fg: #18203a;
  --muted: #5d6680;
  --accent: #2f4fd1;
  --accent-soft: #e5eafc;
  --know: #1f8a5b;
  --know-soft: #def3e9;
  --unsure: #b7700c;
  --unsure-soft: #fbefd9;
  --newc: #c2413b;
  --newc-soft: #fbe3e1;
  --rule: #c9d6f2;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141f; --surface: #1a1f2e; --line: #2c3346; --fg: #e8ebf4; --muted: #9aa3bb;
  --accent: #8ea4ff; --accent-soft: #232c4d; --know: #5fcf98; --know-soft: #173327;
  --unsure: #f0b357; --unsure-soft: #3a2c14; --newc: #f08a84; --newc-soft: #3d1f1e; --rule: #2a3555;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11141f; --surface: #1a1f2e; --line: #2c3346; --fg: #e8ebf4; --muted: #9aa3bb;
  --accent: #8ea4ff; --accent-soft: #232c4d; --know: #5fcf98; --know-soft: #173327;
  --unsure: #f0b357; --unsure-soft: #3a2c14; --newc: #f08a84; --newc-soft: #3d1f1e; --rule: #2a3555;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.savebar { position: sticky; bottom: 0; z-index: 5; margin-inline: -4px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 18px -10px rgba(0, 0, 0, 0.25); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .count { font-family: var(--font-display); color: var(--accent); font-weight: 700; }
.sync { font-size: 0.75rem; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 20px; }
nav.tabs button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 8px 10px; font-weight: 600; color: var(--muted); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--surface); }

.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.know { background: var(--know-soft); border-color: var(--know); color: var(--know); }
.btn.unsure { background: var(--unsure-soft); border-color: var(--unsure); color: var(--unsure); }
.btn.newc { background: var(--newc-soft); border-color: var(--newc); color: var(--newc); }

/* progress bar */
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.bar .k { background: var(--know); } .bar .h { background: var(--unsure); } .bar .n { background: var(--newc); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* sorting list */
.sortlist { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.sortlist li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
.sortlist li:first-child { border-top: 0; }
.sortlist .w { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center; }
.sortlist .sk { font-weight: 600; font-size: 1.2rem; line-height: 1.25; overflow-wrap: anywhere; }
.sortlist .en { display: flex; align-items: center; gap: 2px; color: var(--accent); font-weight: 500; font-size: 1.05rem; min-width: 0; overflow-wrap: anywhere; }
.hide-en .sortlist .en span { visibility: hidden; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex-shrink: 0; }
.seg button { border: 0; border-left: 1px solid var(--line); background: transparent; padding: 7px 10px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.seg button:first-child { border-left: 0; }
.seg button.on[data-v="k"] { background: var(--know-soft); color: var(--know); }
.seg button.on[data-v="h"] { background: var(--unsure-soft); color: var(--unsure); }
.seg button.on[data-v="n"] { background: var(--newc-soft); color: var(--newc); }
.speak { border: 0; background: transparent; color: var(--muted); padding: 4px; border-radius: 6px; line-height: 0; }
.speak:hover { color: var(--accent); }
.speak svg { width: 18px; height: 18px; }
@media (max-width: 480px) {
  .wrap { padding-block: 12px 24px; }
  header.top { gap: 4px 12px; margin-bottom: 12px; }
  .sortlist li { flex-wrap: wrap; gap: 8px; padding: 10px 12px 12px; }
  .sortlist .w { flex-basis: 100%; }
  .seg { width: 100%; }
  .seg button { flex: 1; min-height: 44px; padding: 6px 4px; font-size: 0.95rem; }
  .speak { padding: 9px; margin: -9px 0; }
  .savebar { flex-wrap: nowrap; gap: 10px; }
  .savebar .small { font-size: 0.8rem; line-height: 1.35; }
  .savebar .btn { flex-shrink: 0; padding: 12px 14px; }
  .card .face { min-height: 46vh; }
  .rate .btn { min-height: 56px; font-size: 1.05rem; }
  .card .actions .row .btn { min-height: 48px; }
  .card .actions .row.spread { flex-wrap: nowrap; }
  .card .actions .row .btn { padding-inline: 10px; }
  .btn { min-height: 44px; }
  .btn.ghost.small { min-height: 40px; }
}

/* decks */
.decks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .decks { grid-template-columns: 1fr; } }
.deck { display: flex; flex-direction: column; gap: 10px; }
.deck .tag { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
.deck.h .tag { color: var(--unsure); } .deck.n .tag { color: var(--newc); }
.deck .big { font-family: var(--font-display); font-size: 2rem; font-weight: 700; line-height: 1; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 5px 12px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* study card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.card .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 2px solid var(--newc); font-size: 0.85rem; color: var(--muted); }
.card .face { min-height: 240px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--rule) 35px, var(--rule) 36px); background-position: 0 20px; }
.card .prompt { font-family: var(--font-display); font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
.card .answer { font-family: var(--font-display); font-size: clamp(1.4rem, 5vw, 1.9rem); font-weight: 500; color: var(--accent); overflow-wrap: anywhere; }
.card .ex { font-style: italic; color: var(--muted); max-width: 46ch; background: var(--surface); padding: 2px 6px; border-radius: 6px; }
.card .actions { padding: 14px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate .btn { padding: 12px 6px; }
.typein { width: 100%; max-width: 320px; font: inherit; font-size: 1.2rem; text-align: center; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.typein.ok { border-color: var(--know); } .typein.bad { border-color: var(--newc); }
.verdict { font-weight: 600; } .verdict.ok { color: var(--know); } .verdict.near { color: var(--unsure); } .verdict.bad { color: var(--newc); }

/* known list */
.search { width: 100%; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.known { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.known li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); }
.known li:first-child { border-top: 0; }
.known .w { flex: 1; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); text-align: left; font: inherit; color: inherit; }
button.stat { cursor: pointer; }
button.stat[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; }
.stat.k b { color: var(--know); } .stat.h b { color: var(--unsure); } .stat.n b { color: var(--newc); }
.empty { text-align: center; padding: 28px 16px; }
.update { position: fixed; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; background: var(--fg); color: var(--bg); border-radius: 12px; font-weight: 600; max-width: 688px; margin-inline: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .card { animation: pop .18s ease-out; } @keyframes pop { from { transform: translateY(4px); opacity: .6; } } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Tisícka slovíčok</h1><span class="count num" id="hdrCount"></span></div>
    <span class="sync" id="sync">Pokrok sa ukladá v tomto prehliadači</span>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-sort" data-tab="sort">Triedenie</button>
    <button role="tab" id="tab-learn" data-tab="learn">Učenie</button>
    <button role="tab" id="tab-stats" data-tab="stats">Prehľad</button>
  </nav>
  <main id="view"></main>
</div>
<div class="update" id="update" hidden><span>Je dostupná nová verzia.</span><button class="btn primary" id="reloadNow">Obnoviť</button></div>
<div class="toast" id="toast" hidden></div>

<script>
const VERSION = "/*VERSION*/";
const RAW = /*WORDS*/;
const WORDS = RAW.trim().split("\n").map(l => { const [en, sk, ex] = l.split("|"); return { id: en + "|" + sk, en, sk, ex }; });
const BYID = Object.fromEntries(WORDS.map(w => [w.id, w]));
const PAGE = 50, SESSION = 20, WRITE_MIN = 20, WRITE_MAX = 15;
const INTERVALS = [0, 1, 3, 7, 14]; // days per box; Viem in the last box = learned
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);

/* ---------- state ---------- */
// st.w[id] = [status, box, due]  status: k = viem, h = váham, n = nové
let st = { w: {}, t: 0, opts: { dir: "sk", mode: "cards" }, days: [] };
let tab = "sort", session = null, sortDraft = {}, showSk = true, knownQuery = "", statsFilter = "h", confirmReset = false;
const LS = "tisicka-v1";
try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.w) st = Object.assign(st, s); } catch (e) {}

let db = null, docRef = null, saveTimer = null;
function save() {
  st.t = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {}
  if (!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await docRef.set({ data: JSON.stringify(st), t: st.t }); setSync("Uložené vo vašom účte"); }
    catch (e) { setSync("Nepodarilo sa uložiť do účtu, pokrok ostáva v prehliadači"); }
  }, 1200);
}
function setSync(t) { document.getElementById("sync").textContent = t; }
(async () => {
  try {
    if (!window.claude?.use) return;
    db = await claude.use("db");
    const user = await claude.use("user");
    const id = user && await user.id();
    if (!db || !id) return;
    docRef = db.collection("data/users/" + id).doc("progress");
    const snap = await docRef.get();
    const d = snap.exists ? snap.data() : null;
    if (d && d.data && (d.t || 0) > (st.t || 0)) {
      st = Object.assign({ w: {}, opts: { dir: "sk", mode: "cards" }, days: [] }, JSON.parse(d.data));
      try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {}
      if (!session) render();
    } else if (Object.keys(st.w).length) { save(); }
    setSync("Pokrok sa ukladá vo vašom účte");
  } catch (e) { /* stay on browser storage */ }
})();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("en"));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { toast("Tento prehliadač nevie čítať nahlas"); }
}
let toastT; function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }
function counts() {
  const c = { k: 0, h: 0, n: 0, u: 0, dueH: 0, dueN: 0 }, d = today();
  for (const w of WORDS) {
    const s = st.w[w.id];
    if (!s) { c.u++; continue; }
    c[s[0]]++;
    if (s[0] === "h" && s[2] <= d) c.dueH++;
    if (s[0] === "n" && s[2] <= d) c.dueN++;
  }
  return c;
}
function markDay() { const d = today(); if (!st.days.includes(d)) { st.days.push(d); st.days = st.days.slice(-60); } }
function streak() { let n = 0, d = today(); if (!st.days.includes(d)) d--; while (st.days.includes(d)) { n++; d--; } return n; }
function blank(ex, en) {
  const re = new RegExp("\\b" + en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+") + "\\w*", "i");
  return re.test(ex) ? ex.replace(re, "_____") : null;
}
function norm(s) { return s.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z' -]/g, "").replace(/^to /, "").replace(/\s+/g, " ").trim(); }
function lev(a, b) {
  const m = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return m[a.length][b.length];
}

/* ---------- views ---------- */
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  const c = counts();
  $("#hdrCount").textContent = c.k + " / " + WORDS.length + " viem";
  const v = $("#view");
  v.className = showSk ? "" : "hide-en";
  v.innerHTML = tab === "sort" ? viewSort(c) : tab === "learn" ? (session ? viewCard() : viewLearn(c)) : viewStats(c);
  if (tab === "learn" && session && session.mode === "write" && !session.checked) { const i = $("#typein"); if (i) i.focus(); }
}

function bar(c) {
  const t = WORDS.length, p = x => (100 * x / t).toFixed(2) + "%";
  return `<div class="bar" aria-hidden="true"><span class="k" style="width:${p(c.k)}"></span><span class="h" style="width:${p(c.h)}"></span><span class="n" style="width:${p(c.n)}"></span></div>
  <div class="legend num"><span><i style="background:var(--know)"></i>Viem ${c.k}</span><span><i style="background:var(--unsure)"></i>Váham ${c.h}</span><span><i style="background:var(--newc)"></i>Nové ${c.n}</span><span><i style="background:var(--line)"></i>Neroztriedené ${c.u}</span></div>`;
}

function sortPage() { return WORDS.filter(w => !st.w[w.id]).slice(0, PAGE); }
function viewSort(c) {
  const page = sortPage();
  if (!page.length) return `<div class="panel empty stack"><h2>Všetko je roztriedené</h2><p class="muted">Prejdi na Učenie a precvičuj slová, pri ktorých váhaš, a nové slová.</p><div><button class="btn primary" data-go="learn">Ísť na učenie</button></div></div>`;
  const done = WORDS.length - c.u, pageNo = Math.floor(done / PAGE) + 1, pages = Math.ceil(WORDS.length / PAGE);
  for (const w of page) if (!sortDraft[w.id]) sortDraft[w.id] = "n";
  const nK = page.filter(w => sortDraft[w.id] === "k").length, nH = page.filter(w => sortDraft[w.id] === "h").length;
  return `<div class="stack">
    <div class="stack" style="gap:8px">
      <div class="row spread"><h2>Strana ${pageNo} z ${pages}</h2><span class="muted small num">roztriedené ${done} z ${WORDS.length}</span></div>
      ${bar(c)}
    </div>
    <p class="muted">Označ slová, ktoré <b style="color:var(--know)">vieš</b> naisto, a tie, pri ktorých <b style="color:var(--unsure)">váhaš</b>. Ostatné ostanú ako <b style="color:var(--newc)">nové</b>. Slová, ktoré vieš, sa ti už nebudú zobrazovať.</p>
    <div class="row spread">
      <div class="row"><button class="btn" data-all="k">Všetky viem</button><button class="btn ghost" data-all="n">Zrušiť označenie</button></div>
      <button class="btn ghost" id="toggleSk">${showSk ? "Skryť angličtinu" : "Ukázať angličtinu"}</button>
    </div>
    <ul class="sortlist">${page.map(w => `<li>
      <div class="w"><div class="sk">${esc(w.sk)}</div><div class="en"><span>${esc(w.en)}</span><button class="speak" data-say="${esc(w.en)}" aria-label="Prečítať ${esc(w.en)}">${SPEAK}</button></div></div>
      <div class="seg" role="group" aria-label="${esc(w.en)}">${[["k", "Viem"], ["h", "Váham"], ["n", "Nové"]].map(([v, l]) =>
        `<button data-id="${esc(w.id)}" data-v="${v}" class="${sortDraft[w.id] === v ? "on" : ""}" aria-pressed="${sortDraft[w.id] === v}">${l}</button>`).join("")}</div>
    </li>`).join("")}</ul>
    <div class="panel row spread savebar">
      <span class="small num"><b style="color:var(--know)">${nK} viem</b> · <b style="color:var(--unsure)">${nH} váham</b> · <b style="color:var(--newc)">${page.length - nK - nH} nové</b></span>
      <button class="btn primary" id="savePage">Uložiť, ďalších ${PAGE}</button>
    </div>
  </div>`;
}

function viewLearn(c) {
  if (!c.h && !c.n) return `<div class="panel empty stack"><h2>Zatiaľ nie je čo učiť</h2><p class="muted">Najprv v Triedení označ, ktoré slová vieš. Tie, pri ktorých váhaš, a nové slová sa objavia tu.</p><div><button class="btn primary" data-go="sort">Začať triediť</button></div></div>`;
  const o = st.opts, wr = c.h + c.n;
  return `<div class="stack">
    <div class="row spread"><h2>Na dnes</h2><span class="muted small num">séria ${streak()} ${streak() === 1 ? "deň" : streak() < 5 && streak() > 1 ? "dni" : "dní"}</span></div>
    <div class="decks">
      <div class="panel deck h">
        <span class="tag">Váham</span>
        <div class="row" style="align-items:baseline"><span class="big num">${c.dueH}</span><span class="muted small num">na opakovanie z ${c.h}</span></div>
        <p class="small muted">Kartičky: spomeň si a otoč.</p>
        <button class="btn primary" data-start="h" ${c.dueH ? "" : "disabled"}>${c.dueH ? "Opakovať" : "Na dnes hotovo"}</button>
      </div>
      <div class="panel deck n">
        <span class="tag">Nové</span>
        <div class="row" style="align-items:baseline"><span class="big num">${c.dueN}</span><span class="muted small num">na opakovanie z ${c.n}</span></div>
        <p class="small muted">Kartičky: spomeň si a otoč.</p>
        <button class="btn primary" data-start="n" ${c.dueN ? "" : "disabled"}>${c.dueN ? "Učiť sa" : "Na dnes hotovo"}</button>
      </div>
    </div>
    <div class="panel stack" style="gap:10px">
      <div class="row spread"><h3>Písanie</h3><span class="small muted num">${wr} z ${WRITE_MIN} slov</span></div>
      ${wr >= WRITE_MIN
        ? `<p class="small muted">Vidíš slovenské slovo a napíšeš anglické. Kolo má najviac ${WRITE_MAX} slov zo skupín Váham a Nové. Správne napísané slovo sa presunie medzi Viem.</p><div><button class="btn primary" data-write="all">Spustiť písanie</button></div>`
        : `<p class="small muted">Odomkne sa, keď budeš mať aspoň ${WRITE_MIN} slov v skupinách Váham a Nové. Zatiaľ ich máš ${wr}.</p><div class="bar" aria-hidden="true"><span class="k" style="width:${(100 * wr / WRITE_MIN).toFixed(0)}%"></span></div>`}
    </div>
    <div class="panel stack" style="gap:10px">
      <span class="small muted">Smer pri kartičkách</span>
      <div class="opts" role="group" aria-label="Smer">
        <button class="chip" data-dir="sk" aria-pressed="${o.dir === "sk"}">Slovensky → anglicky</button>
        <button class="chip" data-dir="en" aria-pressed="${o.dir === "en"}">Anglicky → slovensky</button>
      </div>
      <p class="small muted">Jedno kolo má najviac ${SESSION} slov. Keď slovo niekoľkokrát po sebe označíš „Viem“, presunie sa medzi naučené a už sa nezobrazí.</p>
    </div>
    ${(c.h || c.n) && !c.dueH && !c.dueN ? `<div class="panel row spread"><span class="small">Na dnes je všetko zopakované. Chceš si precvičiť aj tak?</span><button class="btn" data-extra="1">Precvičiť navyše</button></div>` : ""}
  </div>`;
}

function startSession(deck, extra, write) {
  const d = today();
  let ids = WORDS.filter(w => { const s = st.w[w.id]; return s && (deck ? s[0] === deck : s[0] !== "k") && (extra || write || s[2] <= d); })
    .sort((a, b) => write ? (st.w[a.id][3] || 0) - (st.w[b.id][3] || 0) || Math.random() - 0.5
                          : st.w[a.id][2] - st.w[b.id][2] || Math.random() - 0.5)
    .slice(0, write ? WRITE_MAX : SESSION).map(w => w.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  if (!ids.length) return;
  const mode = write ? "write" : "cards";
  session = { deck, queue: ids, i: 0, total: ids.length, flipped: false, hint: false, checked: false, verdict: null, typed: "", mode, res: { k: 0, h: 0, n: 0 }, again: new Set() };
  render();
}

function viewCard() {
  const s = session;
  if (s.i >= s.queue.length) {
    const left = WORDS.filter(w => { const x = st.w[w.id]; return x && x[0] !== "k" && (!s.deck || x[0] === s.deck); }).length;
    return `<div class="panel empty stack"><h2>Kolo hotové</h2>
      <p class="num"><b style="color:var(--know)">${s.res.k} viem</b> · <b style="color:var(--unsure)">${s.res.h} váham</b> · <b style="color:var(--newc)">${s.res.n} neviem</b></p>
      ${s.mode === "write"
        ? `<p class="muted small">Správne napísané slová sa presunuli medzi slová, ktoré vieš.</p>`
        : `<p class="muted small">Slová označené „Neviem“ alebo „Váham“ sa vrátia skôr.</p>`}
      <div class="row" style="justify-content:center">
        ${s.mode === "write" && left ? `<button class="btn primary" data-write="${s.deck || "all"}">Ďalšie kolo (zostáva ${left})</button>` : ""}
        <button class="btn ${s.mode === "write" && left ? "" : "primary"}" id="endSession">Späť na prehľad</button>
      </div></div>`;
  }
  const w = BYID[s.queue[s.i]], rec = st.w[w.id], deckName = rec[0] === "h" ? "Váham" : "Nové";
  const skFirst = s.mode === "write" || st.opts.dir === "sk";
  const prompt = skFirst ? w.sk : w.en, answer = skFirst ? w.en : w.sk;
  const hint = skFirst ? blank(w.ex, w.en) : null;
  const head = `<div class="head" style="border-bottom-color:${rec[0] === "h" ? "var(--unsure)" : "var(--newc)"}"><span>${deckName}${s.mode === "write" ? " · písanie" : ""}</span><span class="num">${s.i + 1} / ${s.queue.length}</span><button class="btn ghost small" id="quit">Ukončiť</button></div>`;
  const sayBtn = `<button class="speak" data-say="${esc(w.en)}" aria-label="Prečítať">${SPEAK}</button>`;
  const knowLink = `<button class="btn ghost small" id="mastered">Toto viem naisto, už mi to neukazuj</button>`;

  if (s.mode === "write") {
    const face = !s.checked
      ? `<div class="prompt">${esc(prompt)}</div>
         ${s.hint && hint ? `<div class="ex">${esc(hint)}</div>` : ""}
         <input class="typein" id="typein" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="napíš po anglicky" value="${esc(s.typed)}" aria-label="Anglické slovo">`
      : `<div class="prompt">${esc(prompt)}</div>
         <input class="typein ${s.verdict === "ok" ? "ok" : "bad"}" id="typein" value="${esc(s.typed)}" readonly aria-label="Tvoja odpoveď">
         <div class="verdict ${s.verdict}">${s.verdict === "ok" ? "Správne!" : s.verdict === "near" ? "Skoro! Správne je:" : "Správne je:"}</div>
         ${s.verdict !== "ok" ? `<div class="answer">${esc(w.en)}</div>` : ""}
         <div class="row" style="justify-content:center">${sayBtn}<span class="ex">${esc(w.ex)}</span></div>`;
    const actions = !s.checked
      ? `<div class="row spread"><button class="btn ghost" id="hint" ${hint && !s.hint ? "" : "disabled"}>Nápoveda</button><button class="btn ghost" id="giveup">Neviem</button><button class="btn primary" id="check">Skontrolovať</button></div>`
      : `<div class="row spread">${s.verdict !== "ok" ? `<button class="btn ghost" id="accept">Uznať ako správne</button>` : "<span></span>"}<button class="btn primary" id="next">Ďalej</button></div>${knowLink}`;
    return `<div class="card">${head}<div class="face">${face}</div><div class="actions">${actions}</div></div>`;
  }

  const face = `<div class="prompt">${esc(prompt)}</div>
    ${!skFirst ? `<div>${sayBtn}</div>` : ""}
    ${!s.flipped && s.hint && hint ? `<div class="ex">${esc(hint)}</div>` : ""}
    ${s.flipped ? `<div class="answer">${esc(answer)}</div><div class="row" style="justify-content:center">${skFirst ? sayBtn : ""}<span class="ex">${esc(w.ex)}</span></div>` : ""}`;
  const actions = !s.flipped
    ? `<div class="row spread"><button class="btn ghost" id="hint" ${hint && !s.hint ? "" : "disabled"}>Nápoveda</button><button class="btn primary" id="flip">Otočiť kartičku</button></div>`
    : `<div class="rate"><button class="btn newc" data-rate="n">Neviem</button><button class="btn unsure" data-rate="h">Váham</button><button class="btn know" data-rate="k">Viem</button></div>${knowLink}`;
  return `<div class="card">${head}<div class="face">${face}</div><div class="actions">${actions}</div></div>`;
}

function rate(r) {
  const s = session, id = s.queue[s.i], rec = st.w[id], d = today();
  if (s.mode === "write") {
    rec[3] = Date.now();
    if (r === "k") rec[0] = "k";                       // správne napísané = Viem
    else if (r === "h") { if (rec[0] === "n") rec[0] = "h"; rec[2] = d; } // skoro: aspoň Váham
    else rec[2] = d;                                   // nesprávne: ostáva kde je, bez opakovania v kole
  } else if (r === "n") {
    rec[1] = 0; rec[2] = d;
    if (!s.again.has(id)) { s.again.add(id); s.queue.push(id); } // one more try at the end of this round
  } else if (r === "h") {
    rec[1] = Math.max(0, Math.min(rec[1], 1)); rec[2] = d + 1;
  } else if (rec[1] >= INTERVALS.length - 1) {
    rec[0] = "k";
  } else {
    rec[1]++; rec[2] = d + INTERVALS[rec[1]];
  }
  s.res[r]++; markDay(); save();
  Object.assign(s, { i: s.i + 1, flipped: false, hint: false, checked: false, verdict: null, typed: "" });
  render();
}
function checkTyped() {
  const s = session, w = BYID[s.queue[s.i]], inp = $("#typein");
  s.typed = inp.value;
  if (!norm(s.typed)) { inp.focus(); return; }
  const a = norm(s.typed), b = norm(w.en);
  s.verdict = a === b ? "ok" : (b.length > 4 && lev(a, b) <= 1) ? "near" : "bad";
  s.checked = true; render();
  $("#next")?.focus();
}

function viewStats(c) {
  const q = knownQuery.trim().toLowerCase(), f = statsFilter;
  const list = WORDS.filter(w => st.w[w.id]?.[0] === f && (!q || w.en.toLowerCase().includes(q) || w.sk.toLowerCase().includes(q)));
  const title = { k: "Slová, ktoré viem", h: "Slová, pri ktorých váham", n: "Nové slová" }[f];
  const hint = { k: "Tieto sa ti nezobrazujú. Ak niektoré chceš predsa ešte precvičiť, vráť ho do učenia.",
                 h: "Preskúšaj sa písaním. Správne napísané slovo sa presunie medzi Viem a prehľad sa prepočíta.",
                 n: "Preskúšaj sa písaním. Správne napísané slovo sa presunie medzi Viem a prehľad sa prepočíta." }[f];
  const stat = (k, n, l) => `<button class="stat ${k}" data-filter="${k}" aria-pressed="${f === k}"><b>${n}</b><span class="small muted">${l}</span></button>`;
  const rowBtn = w => f === "k"
    ? `<button class="btn ghost small" data-back="${esc(w.id)}">Vrátiť do učenia</button>`
    : `<button class="btn ghost small" data-mark="${esc(w.id)}">Už viem</button>`;
  const sk = (w) => esc(w.sk);
  return `<div class="stack">
    <div class="stats num">
      ${stat("k", c.k, "viem")}${stat("h", c.h, "váham")}${stat("n", c.n, "nové")}
      <div class="stat"><b>${streak()}</b><span class="small muted">dní v rade</span></div>
    </div>
    ${bar(c)}
    <div class="stack" style="gap:10px">
      <div class="row spread"><h2>${title}</h2><span class="muted small num">${list.length}</span></div>
      <p class="small muted">${hint}</p>
      ${f !== "k" && list.length ? `<div><button class="btn primary" data-write="${f}">Preskúšať písaním (najviac ${WRITE_MAX})</button></div>` : ""}
      <input class="search" id="kq" type="search" placeholder="Hľadať slovo" value="${esc(knownQuery)}" aria-label="Hľadať slovo">
      ${list.length ? `<ul class="known">${list.slice(0, 300).map(w => `<li><button class="speak" data-say="${esc(w.en)}" aria-label="Prečítať">${SPEAK}</button><div class="w"><b>${sk(w)}</b> <span class="muted">${esc(w.en)}</span></div>${rowBtn(w)}</li>`).join("")}</ul>`
        : `<p class="panel muted small">${q ? "Nič sa nenašlo." : f === "k" ? "Zatiaľ tu nič nie je. Slová pribudnú, keď ich označíš ako „Viem“ alebo ich správne napíšeš." : "Tu je zatiaľ prázdno."}</p>`}
    </div>
    <div class="panel row spread">
      <span class="small muted">${confirmReset ? "Naozaj vymazať celý pokrok? Toto sa nedá vrátiť." : "Začať odznova"}</span>
      ${confirmReset ? `<div class="row"><button class="btn" id="resetNo">Nie</button><button class="btn newc" id="resetYes">Áno, vymazať</button></div>` : `<button class="btn" id="reset">Vymazať pokrok</button>`}
    </div>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) {
    tab = t.dataset.tab; confirmReset = false;
    if (tab === "stats") { const c = counts(); if (!c[statsFilter]) statsFilter = ["h", "n", "k"].find(k => c[k]) || statsFilter; }
    render(); return;
  }
  if (t.dataset.go) { tab = t.dataset.go; render(); return; }
  if (t.dataset.say) { speak(t.dataset.say); return; }
  if (t.dataset.v && t.dataset.id) { sortDraft[t.dataset.id] = t.dataset.v; render(); return; }
  if (t.dataset.all) { sortPage().forEach(w => sortDraft[w.id] = t.dataset.all); render(); return; }
  if (t.id === "toggleSk") { showSk = !showSk; render(); return; }
  if (t.id === "savePage") {
    const page = sortPage(), d = today();
    page.forEach(w => { const v = sortDraft[w.id] || "n"; st.w[w.id] = [v, 0, d]; delete sortDraft[w.id]; });
    save(); render(); window.scrollTo({ top: 0 });
    toast(sortPage().length ? "Uložené. Ďalšia strana je pripravená." : "Uložené. Všetko je roztriedené.");
    return;
  }
  if (t.dataset.dir) { st.opts.dir = t.dataset.dir; save(); render(); return; }
  if (t.dataset.start) { startSession(t.dataset.start, false); return; }
  if (t.dataset.write) { startSession(t.dataset.write === "all" ? null : t.dataset.write, true, true); return; }
  if (t.dataset.filter) { statsFilter = t.dataset.filter; knownQuery = ""; render(); return; }
  if (t.dataset.mark) { const r = st.w[t.dataset.mark]; if (r) { r[0] = "k"; r[1] = 0; r[2] = today(); save(); render(); toast("Presunuté medzi Viem"); } return; }
  if (t.dataset.extra) { startSession(null, true); return; }
  if (t.id === "flip") { session.flipped = true; render(); return; }
  if (t.id === "hint") { session.hint = true; if (session.mode === "write") session.typed = $("#typein").value; render(); return; }
  if (t.dataset.rate) { rate(t.dataset.rate); return; }
  if (t.id === "check") { checkTyped(); return; }
  if (t.id === "giveup") { session.typed = $("#typein").value; session.verdict = "bad"; session.checked = true; render(); return; }
  if (t.id === "accept") { session.verdict = "ok"; rate("k"); return; }
  if (t.id === "next") { rate(session.verdict === "ok" ? "k" : session.verdict === "near" ? "h" : "n"); return; }
  if (t.id === "mastered") {
    const id = session.queue[session.i]; st.w[id][0] = "k"; session.res.k++;
    session.queue = session.queue.filter((x, j) => j <= session.i || x !== id);
    markDay(); save(); toast("Presunuté medzi slová, ktoré vieš");
    Object.assign(session, { i: session.i + 1, flipped: false, hint: false, checked: false, verdict: null, typed: "" }); render(); return;
  }
  if (t.id === "reloadNow") { location.replace(location.pathname + "?v=" + (window.newVersion || Date.now())); return; }
  if (t.id === "quit" || t.id === "endSession") { session = null; render(); return; }
  if (t.dataset.back) { st.w[t.dataset.back] = ["h", 0, today()]; save(); render(); toast("Vrátené medzi slová, pri ktorých váhaš"); return; }
  if (t.id === "reset") { confirmReset = true; render(); return; }
  if (t.id === "resetNo") { confirmReset = false; render(); return; }
  if (t.id === "resetYes") { st.w = {}; st.days = []; confirmReset = false; sortDraft = {}; save(); tab = "sort"; render(); toast("Pokrok vymazaný"); return; }
});
document.addEventListener("keydown", e => {
  if (!session || tab !== "learn") return;
  if (e.target.id === "typein" && e.key === "Enter") { e.preventDefault(); session.checked ? $("#next")?.click() : checkTyped(); return; }
  if (e.target.tagName === "INPUT") return;
  if (session.mode === "cards") {
    if ((e.key === " " || e.key === "Enter") && !session.flipped) { e.preventDefault(); $("#flip")?.click(); }
    else if (session.flipped && ["1", "2", "3"].includes(e.key)) rate({ 1: "n", 2: "h", 3: "k" }[e.key]);
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "kq") { knownQuery = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#kq"); i.focus(); i.setSelectionRange(pos, pos); }
});

render();

/* ---------- automatická kontrola novej verzie ---------- */
async function checkUpdate() {
  if (!/^[0-9a-f]{8,}$/.test(VERSION)) return;            // lokálny náhľad bez verzie
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const v = (await r.json()).v;
    if (!v || v === VERSION) return;
    window.newVersion = v;
    const already = location.search === "?v=" + v;          // po obnovení stále stará verzia: len upozorni
    if (session || already) $("#update").hidden = false;     // počas kola neprerušuj
    else location.replace(location.pathname + "?v=" + v);
  } catch (e) {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
</script>
